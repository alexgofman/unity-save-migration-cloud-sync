name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core tests (dotnet, no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test DotnetTests~ --configuration Release
